<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>8085 programming model</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c1b1f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="280" y="28" font-size="13" text-anchor="middle" fill="#1c1b1f" font-weight="700">Registers the programmer can use</text><rect x="80" y="44" width="200" height="36" rx="2" fill="#e8def8" stroke="#1c1b1f" stroke-width="1.6"/><text x="180" y="66.55" font-size="13" text-anchor="middle" fill="#1c1b1f">Accumulator A (8 bit)</text><rect x="280" y="44" width="200" height="36" rx="2" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="380" y="66.55" font-size="13" text-anchor="middle" fill="#1c1b1f">Flags (8 bit)</text><rect x="80" y="92" width="200" height="36" rx="2" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="180" y="114.9" font-size="14" text-anchor="middle" fill="#1c1b1f">B</text><rect x="280" y="92" width="200" height="36" rx="2" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="380" y="114.9" font-size="14" text-anchor="middle" fill="#1c1b1f">C</text><text x="500" y="115" font-size="12" text-anchor="start" fill="#1c1b1f">BC pair</text><rect x="80" y="132" width="200" height="36" rx="2" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="180" y="154.9" font-size="14" text-anchor="middle" fill="#1c1b1f">D</text><rect x="280" y="132" width="200" height="36" rx="2" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="380" y="154.9" font-size="14" text-anchor="middle" fill="#1c1b1f">E</text><text x="500" y="155" font-size="12" text-anchor="start" fill="#1c1b1f">DE pair</text><rect x="80" y="172" width="200" height="36" rx="2" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="180" y="194.9" font-size="14" text-anchor="middle" fill="#1c1b1f">H</text><rect x="280" y="172" width="200" height="36" rx="2" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="380" y="194.9" font-size="14" text-anchor="middle" fill="#1c1b1f">L</text><text x="500" y="195" font-size="12" text-anchor="start" fill="#1c1b1f">HL pair</text><rect x="80" y="224" width="400" height="36" rx="2" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="280" y="246.55" font-size="13" text-anchor="middle" fill="#1c1b1f">Stack pointer SP (16 bit)</text><rect x="80" y="264" width="400" height="36" rx="2" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="280" y="286.55" font-size="13" text-anchor="middle" fill="#1c1b1f">Program counter PC (16 bit)</text><text x="280" y="322" font-size="12" text-anchor="middle" fill="#1c1b1f">Six 8-bit general purpose registers can be used as three 16-bit pairs.</text></svg>
