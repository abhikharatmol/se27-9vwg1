<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>8051 architecture block diagram</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c1b1f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><line x1="40" y1="210" x2="680" y2="210" stroke="#1c1b1f" stroke-width="3"/><text x="360" y="200" font-size="13" text-anchor="middle" fill="#1c1b1f" font-weight="700">Internal bus</text><rect x="40" y="90" width="148" height="70" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="114" y="129.55" font-size="13" text-anchor="middle" fill="#1c1b1f" font-weight="700">CPU</text><line x1="114" y1="160" x2="114" y2="210" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="202" y="90" width="148" height="70" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="276" y="121.55" font-size="13" text-anchor="middle" fill="#1c1b1f">4 KB ROM</text><text x="276" y="137.55" font-size="13" text-anchor="middle" fill="#1c1b1f">program memory</text><line x1="276" y1="160" x2="276" y2="210" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="364" y="90" width="148" height="70" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="438" y="121.55" font-size="13" text-anchor="middle" fill="#1c1b1f">128 bytes RAM</text><text x="438" y="137.55" font-size="13" text-anchor="middle" fill="#1c1b1f">data memory</text><line x1="438" y1="160" x2="438" y2="210" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="526" y="90" width="148" height="70" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="600" y="121.55" font-size="13" text-anchor="middle" fill="#1c1b1f">Timer 0, Timer 1</text><text x="600" y="137.55" font-size="13" text-anchor="middle" fill="#1c1b1f">16-bit each</text><line x1="600" y1="160" x2="600" y2="210" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="40" y="260" width="148" height="70" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="114" y="291.55" font-size="13" text-anchor="middle" fill="#1c1b1f">Oscillator</text><text x="114" y="307.55" font-size="13" text-anchor="middle" fill="#1c1b1f">clock</text><line x1="114" y1="210" x2="114" y2="260" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="202" y="260" width="148" height="70" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="276" y="291.55" font-size="13" text-anchor="middle" fill="#1c1b1f">Interrupt control</text><text x="276" y="307.55" font-size="13" text-anchor="middle" fill="#1c1b1f">5 sources</text><line x1="276" y1="210" x2="276" y2="260" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="364" y="260" width="148" height="70" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="438" y="291.55" font-size="13" text-anchor="middle" fill="#1c1b1f">Serial port</text><text x="438" y="307.55" font-size="13" text-anchor="middle" fill="#1c1b1f">TXD, RXD</text><line x1="438" y1="210" x2="438" y2="260" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="526" y="260" width="148" height="70" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="600" y="291.55" font-size="13" text-anchor="middle" fill="#1c1b1f">4 I/O ports</text><text x="600" y="307.55" font-size="13" text-anchor="middle" fill="#1c1b1f">P0 P1 P2 P3</text><line x1="600" y1="210" x2="600" y2="260" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="360" y="370" font-size="12" text-anchor="middle" fill="#1c1b1f">A whole computer on one chip: CPU, memory, timers, serial port and I/O ports.</text><text x="360" y="392" font-size="12" text-anchor="middle" fill="#1c1b1f">External memory can be added through ports P0 and P2 (64 KB code, 64 KB data).</text></svg>
