<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Process state diagram</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c1b1f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="30" y="120" width="100" height="50" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="80" y="149.9" font-size="14" text-anchor="middle" fill="#1c1b1f">New</text><rect x="200" y="120" width="110" height="50" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="255" y="149.9" font-size="14" text-anchor="middle" fill="#1c1b1f" font-weight="700">Ready</text><rect x="420" y="120" width="110" height="50" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="475" y="149.9" font-size="14" text-anchor="middle" fill="#1c1b1f" font-weight="700">Running</text><rect x="590" y="120" width="110" height="50" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="645" y="149.55" font-size="13" text-anchor="middle" fill="#1c1b1f">Terminated</text><rect x="310" y="250" width="120" height="50" rx="6" fill="#fff" stroke="#1c1b1f" stroke-width="1.6"/><text x="370" y="279.9" font-size="14" text-anchor="middle" fill="#1c1b1f" font-weight="700">Blocked</text><line x1="130" y1="145" x2="200" y2="145" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)"/><text x="165" y="136" font-size="11" text-anchor="middle" fill="#1c1b1f">admitted</text><path d="M310 130 C360 95 380 95 420 130" fill="none" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)"/><text x="365" y="92" font-size="11" text-anchor="middle" fill="#1c1b1f">dispatch</text><path d="M420 160 C380 195 360 195 310 160" fill="none" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)"/><text x="365" y="205" font-size="11" text-anchor="middle" fill="#1c1b1f">time slice over</text><line x1="530" y1="145" x2="590" y2="145" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)"/><text x="560" y="136" font-size="11" text-anchor="middle" fill="#1c1b1f">exit</text><path d="M475 170 L430 250" fill="none" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)"/><text x="500" y="222" font-size="11" text-anchor="start" fill="#1c1b1f">waits for I/O</text><path d="M310 270 L255 170" fill="none" stroke="#1c1b1f" stroke-width="1.6" marker-end="url(#a)"/><text x="240" y="232" font-size="11" text-anchor="end" fill="#1c1b1f">I/O done</text><text x="360" y="40" font-size="12" text-anchor="middle" fill="#1c1b1f">Running: using the CPU. Ready: waiting for the CPU. Blocked: waiting for an event such as I/O.</text></svg>
